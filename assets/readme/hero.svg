<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">LazyOffice</title>
  <desc id="hero-desc">브라우저에서 바로 쓰는 사내 업무자동화 허브. 설치·로그인 없이, 서버로 데이터를 보내지 않고 반복 업무를 자동화합니다.</desc>

  <defs>
    <filter id="mesh-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <radialGradient id="page-fade" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#F5F7FC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="398" rx="28" fill="url(#page-fade)" stroke="#E4E9F1" stroke-width="1.5"/>

  <g filter="url(#mesh-blur)" opacity="0.55">
    <circle cx="470" cy="70" r="95" fill="#4F7FFF"/>
    <circle cx="660" cy="60" r="95" fill="#8B5CF6"/>
    <circle cx="700" cy="125" r="95" fill="#EA5FD1"/>
    <circle cx="500" cy="130" r="90" fill="#4FC3F7"/>
  </g>

  <g id="asterisk-mark" transform="translate(600 96)">
    <g fill="#4F5FEA">
      <rect x="-4.5" y="-30" width="9" height="30" rx="4.5"/>
      <rect x="-4.5" y="-30" width="9" height="30" rx="4.5" transform="rotate(45)"/>
      <rect x="-4.5" y="-30" width="9" height="30" rx="4.5" transform="rotate(90)"/>
      <rect x="-4.5" y="-30" width="9" height="30" rx="4.5" transform="rotate(135)"/>
      <rect x="-4.5" y="-30" width="9" height="30" rx="4.5" transform="rotate(180)"/>
      <rect x="-4.5" y="-30" width="9" height="30" rx="4.5" transform="rotate(225)"/>
      <rect x="-4.5" y="-30" width="9" height="30" rx="4.5" transform="rotate(270)"/>
      <rect x="-4.5" y="-30" width="9" height="30" rx="4.5" transform="rotate(315)"/>
    </g>
  </g>

  <text x="600" y="218" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="54" letter-spacing="-1.2">
    <tspan fill="#4F5FEA" font-weight="700">Lazy</tspan><tspan fill="#0B1220" font-weight="800">Office</tspan>
  </text>

  <text x="600" y="260" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" fill="#5B6B7C">반복 업무는 몇 번의 클릭으로, 필요한 자동화 도구를 한 곳에</text>

  <g id="trust-badges" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="700" fill="#4F5FEA">
    <g transform="translate(273 300)">
      <rect width="227" height="40" rx="20" fill="#FBFCFF" stroke="#E3E7F5" stroke-width="1.5"/>
      <g transform="translate(16 11)" stroke="#4F5FEA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="7" width="18" height="11" rx="2"/>
        <path d="M3.5 7V5a5.5 5.5 0 0 1 11 0v2"/>
      </g>
      <text x="44" y="26">브라우저에서만 처리</text>
    </g>
    <g transform="translate(516 300)">
      <rect width="216" height="40" rx="20" fill="#FBFCFF" stroke="#E3E7F5" stroke-width="1.5"/>
      <g transform="translate(16 10)" stroke="#4F5FEA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 0 2.5 2.4v6C2.5 13 5.5 15 9 16.5c3.5-1.5 6.5-3.5 6.5-8v-6Z"/>
        <path d="M5.7 8.4 8 10.7 12.3 6"/>
      </g>
      <text x="44" y="26">데이터 서버 미전송</text>
    </g>
    <g transform="translate(748 300)">
      <rect width="180" height="40" rx="20" fill="#FBFCFF" stroke="#E3E7F5" stroke-width="1.5"/>
      <g transform="translate(16 8)" stroke="#4F5FEA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.5 1 3.5 10.5h6l-1.2 9.5L15.5 10h-6Z"/>
      </g>
      <text x="44" y="26">설치 필요 없음</text>
    </g>
  </g>

  <text x="600" y="368" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#9AA6B2">사내 업무지원 플랫폼 허브 · lazy-mj.github.io/lazy-office</text>
</svg>
