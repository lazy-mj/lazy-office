<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="proof-title proof-desc">
  <title id="proof-title">LazyOffice에 있는 도구</title>
  <desc id="proof-desc">전화요금 계정분할 자동화, 예산 검증 도구, 참여율 대조 도구, 그리고 다음 자동화를 제안하는 카드로 구성된 실제 허브 화면.</desc>

  <rect x="1" y="1" width="1198" height="608" rx="28" fill="#FFFFFF" stroke="#E4E9F1" stroke-width="1.5"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif">

    <!-- Card 1: bill split -->
    <g transform="translate(36 40)">
      <rect width="360" height="250" rx="18" fill="#FFFFFF" stroke="#D3D9E3" stroke-width="1.5"/>
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#E8ECFE"/>
      <svg x="35" y="35" width="22" height="22" viewBox="0 0 24 24" stroke="#4F5FEA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
        <line x1="20" x2="8.12" y1="4" y2="15.88"/><line x1="14.47" x2="20" y1="14.48" y2="20"/><line x1="8.12" x2="12" y1="8.12" y2="12"/>
      </svg>
      <text x="24" y="96" font-size="20" font-weight="700" fill="#1D2733">전화요금 계정분할 자동화</text>
      <text x="24" y="122" font-size="18" fill="#8B98A6">부서별 전화요금을 계정번호별로</text>
      <text x="24" y="146" font-size="18" fill="#8B98A6">자동 분할·집계합니다</text>
      <g transform="translate(24 188)">
        <rect width="128" height="34" rx="17" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
        <text x="18" y="22" font-size="15" font-weight="700" fill="#1D2733">바로가기 ↗</text>
      </g>
    </g>

    <!-- Card 2: budget check -->
    <g transform="translate(420 40)">
      <rect width="360" height="250" rx="18" fill="#FFFFFF" stroke="#D3D9E3" stroke-width="1.5"/>
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#FCE9FA"/>
      <svg x="35" y="35" width="22" height="22" viewBox="0 0 24 24" stroke="#C13FC0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
      </svg>
      <text x="24" y="96" font-size="20" font-weight="700" fill="#1D2733">예산 검증 도구</text>
      <text x="24" y="122" font-size="18" fill="#8B98A6">PMS와 이지바로/RCMS 예산을</text>
      <text x="24" y="146" font-size="18" fill="#8B98A6">비목별로 자동 대조합니다</text>
      <g transform="translate(24 170)">
        <circle cx="3" cy="-4" r="2.5" fill="#C9D2DC"/>
        <text x="12" y="0" font-size="14" fill="#9AA6B2">기본사업 지원 준비 중</text>
      </g>
      <g transform="translate(24 188)">
        <rect width="128" height="34" rx="17" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
        <text x="18" y="22" font-size="15" font-weight="700" fill="#1D2733">바로가기 ↗</text>
      </g>
    </g>

    <!-- Card 3: timecard -->
    <g transform="translate(804 40)">
      <rect width="360" height="250" rx="18" fill="#FFFFFF" stroke="#D3D9E3" stroke-width="1.5"/>
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#E0F2FE"/>
      <svg x="35" y="35" width="22" height="22" viewBox="0 0 24 24" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>
      </svg>
      <text x="24" y="96" font-size="20" font-weight="700" fill="#1D2733">참여율 대조 도구</text>
      <text x="24" y="122" font-size="18" fill="#8B98A6">PMS와 IRIS·RCMS 참여율을</text>
      <text x="24" y="146" font-size="18" fill="#8B98A6">사람별·월별로 자동 대조합니다</text>
      <g transform="translate(24 170)">
        <circle cx="3" cy="-4" r="2.5" fill="#F59E0B"/>
        <text x="12" y="0" font-size="14" fill="#9AA6B2">개발 중 · 테스트 버전</text>
      </g>
      <g transform="translate(24 188)">
        <rect width="128" height="34" rx="17" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
        <text x="18" y="22" font-size="15" font-weight="700" fill="#1D2733">바로가기 ↗</text>
      </g>
    </g>

    <!-- Card 4: suggest (허브처럼 두 번째 줄) -->
    <g transform="translate(36 320)">
      <rect width="360" height="250" rx="18" fill="#F4F8FB" stroke="#CFD9E0" stroke-width="1.5" stroke-dasharray="5 5"/>
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#FFFFFF"/>
      <svg x="35" y="35" width="22" height="22" viewBox="0 0 24 24" stroke="#5B6B7C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
        <path d="M9 18h6"/><path d="M10 22h4"/>
      </svg>
      <text x="24" y="96" font-size="20" font-weight="700" fill="#4A5A68">다음엔 어떤 자동화가</text>
      <text x="24" y="122" font-size="20" font-weight="700" fill="#4A5A68">필요할까요?</text>
      <text x="24" y="150" font-size="18" fill="#7C8B98">다음에 만들면 좋을 업무를</text>
      <text x="24" y="174" font-size="18" fill="#7C8B98">제안해주세요</text>
      <text x="24" y="208" font-size="16" font-weight="600" fill="#5F7488">📨 문의 : 전민지</text>
    </g>

  </g>
</svg>
